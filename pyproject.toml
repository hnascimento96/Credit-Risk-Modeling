
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-modeling"
version = "0.1.0"
description = "Probability of Default modeling for credit risk"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "joblib",
    "xgboost",
    "lightgbm",
    "catboost",
    "shap",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
