
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-modeling"
version = "0.1.0"
description = "Probability of Default modeling for credit risk"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "jupyter",
    "shap"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
